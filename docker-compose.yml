services:

   web:
     build: .
     container_name: devops-task-manager
     ports:
        - "80:80"

     depends_on:
       - backend
        
   backend:
      build: ./backend
      container_name: devops-task-manager-backend
      environment:
        PORT: ${BACKEND_PORT}
        APP_NAME: ${APP_NAME}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        

      secrets:
        - db_password

      depends_on:
        postgres:
          condition: service_healthy
   postgres:
    image: postgres:alpine
    container_name: devops-task-manager-db

    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cse123
    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

    secrets:
      - db_password

volumes:
   postgres-data:

secrets:
   db_password:
     file: ./secrets/db_password.txt
